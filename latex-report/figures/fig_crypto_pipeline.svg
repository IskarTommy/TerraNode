<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640">
  <defs>
    <style>
      .title-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .sub-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #64748b; text-anchor: middle; }
      .header-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; }
      .body-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #334155; }
      .code-box { font-family: 'Consolas', monospace; font-size: 11px; fill: #0f766e; background-color: #f0fdfa; }
      .box-blue { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.5; rx: 8; ry: 8; }
      .box-green { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; rx: 8; ry: 8; }
      .box-purple { fill: #faf5ff; stroke: #9333ea; stroke-width: 1.5; rx: 8; ry: 8; }
      .box-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; rx: 8; ry: 8; }
      .box-indigo { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.5; rx: 8; ry: 8; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="640" fill="#f8fafc"/>

  <!-- Title -->
  <text x="550" y="35" class="title-text">TerraNode Cryptographic Processing &amp; Blockchain Anchoring Pipeline</text>
  <text x="550" y="55" class="sub-title">Multi-Layered Security Architecture: Hashing, Symmetric Encryption, Digital Signatures, and Smart Contract State</text>

  <!-- Stage 1: Plaintext Ingestion -->
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="190" height="400" class="box-blue"/>
    <rect x="30" y="80" width="190" height="35" fill="#bae6fd" rx="8" ry="8"/>
    <text x="125" y="103" class="header-text" text-anchor="middle" fill="#0369a1">Stage 1: Plaintext Ingestion</text>

    <text x="45" y="140" class="body-text" font-weight="bold">Raw Telemetry Input:</text>
    <rect x="40" y="150" width="170" height="135" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="48" y="170" font-family="Consolas" font-size="10" fill="#0369a1">{</text>
    <text x="55" y="190" font-family="Consolas" font-size="10" fill="#334155">"farmer_id": 14,</text>
    <text x="55" y="210" font-family="Consolas" font-size="10" fill="#334155">"temp": 24.50,</text>
    <text x="55" y="230" font-family="Consolas" font-size="10" fill="#334155">"moisture": 58.20,</text>
    <text x="55" y="250" font-family="Consolas" font-size="10" fill="#334155">"ph": 6.80,</text>
    <text x="55" y="270" font-family="Consolas" font-size="10" fill="#334155">"ts": 1725148800</text>
    <text x="48" y="282" font-family="Consolas" font-size="10" fill="#0369a1">}</text>

    <text x="45" y="315" class="body-text" font-weight="bold">Field Boundary Check:</text>
    <text x="45" y="335" class="body-text">• -50.0 ≤ Temp ≤ 100.0</text>
    <text x="45" y="355" class="body-text">• 0.0 ≤ Moisture ≤ 100.0</text>
    <text x="45" y="375" class="body-text">• 0.0 ≤ pH ≤ 14.0</text>

    <rect x="40" y="400" width="170" height="65" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="48" y="420" class="body-text" font-weight="bold">Validation Latency:</text>
    <text x="48" y="440" font-family="Consolas" font-size="11" fill="#0284c7">T_val ≈ 0.005 ms</text>
    <text x="48" y="455" class="body-text">Deterministic validation</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 220 280 L 250 280" class="arrow"/>

  <!-- Stage 2: SHA-256 Integrity Hashing -->
  <g filter="url(#shadow)">
    <rect x="250" y="80" width="185" height="400" class="box-green"/>
    <rect x="250" y="80" width="185" height="35" fill="#bbf7d0" rx="8" ry="8"/>
    <text x="342" y="103" class="header-text" text-anchor="middle" fill="#15803d">Stage 2: SHA-256 Digest</text>

    <text x="262" y="140" class="body-text" font-weight="bold">Digest Generation:</text>
    <rect x="258" y="150" width="168" height="60" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="265" y="172" font-family="Consolas" font-size="10" fill="#15803d">H = SHA-256(M)</text>
    <text x="265" y="195" font-family="Consolas" font-size="9" fill="#475569">"a7c4...9f2e" (64 hex)</text>

    <text x="262" y="235" class="body-text" font-weight="bold">Security Properties:</text>
    <text x="262" y="255" class="body-text">• Collision Resistant</text>
    <text x="262" y="275" class="body-text">• Avalanche Effect (50%)</text>
    <text x="262" y="295" class="body-text">• Zero Pre-image Leak</text>

    <text x="262" y="325" class="body-text" font-weight="bold">Purpose:</text>
    <text x="262" y="345" class="body-text">• Database deduplication</text>
    <text x="262" y="365" class="body-text">• Anchored on Sui batch</text>
    <text x="262" y="385" class="body-text">• Tamper-evident proof</text>

    <rect x="258" y="405" width="168" height="60" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="265" y="425" class="body-text" font-weight="bold">Hashing Benchmark:</text>
    <text x="265" y="445" font-family="Consolas" font-size="11" fill="#16a34a">T_hash ≈ 0.012 ms</text>
    <text x="265" y="458" class="body-text">(12 microseconds)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 435 280 L 465 280" class="arrow"/>

  <!-- Stage 3: AES-256 Encryption -->
  <g filter="url(#shadow)">
    <rect x="465" y="80" width="185" height="400" class="box-amber"/>
    <rect x="465" y="80" width="185" height="35" fill="#fde68a" rx="8" ry="8"/>
    <text x="557" y="103" class="header-text" text-anchor="middle" fill="#b45309">Stage 3: AES-256-GCM</text>

    <text x="477" y="140" class="body-text" font-weight="bold">Confidential Storage:</text>
    <rect x="473" y="150" width="168" height="60" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="480" y="172" font-family="Consolas" font-size="10" fill="#b45309">C = AES-GCM(K, IV, M)</text>
    <text x="480" y="195" font-family="Consolas" font-size="9" fill="#475569">Auth Tag: 128-bit MAC</text>

    <text x="477" y="235" class="body-text" font-weight="bold">Ciphertext Decryption:</text>
    <rect x="473" y="245" width="168" height="45" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="480" y="265" font-family="Consolas" font-size="10" fill="#b45309">M = Decrypt(K, IV, C, Tag)</text>
    <text x="480" y="280" font-family="Consolas" font-size="9" fill="#15803d">Verifies AEAD integrity</text>

    <text x="477" y="315" class="body-text" font-weight="bold">Benchmark Metrics:</text>
    <text x="477" y="335" class="body-text">• Key Size: 256 bits</text>
    <text x="477" y="355" class="body-text">• IV / Nonce: 96 bits</text>

    <rect x="473" y="380" width="168" height="85" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="480" y="400" class="body-text" font-weight="bold">Execution Latency:</text>
    <text x="480" y="420" font-family="Consolas" font-size="10" fill="#d97706">T_enc ≈ 0.028 ms</text>
    <text x="480" y="440" font-family="Consolas" font-size="10" fill="#d97706">T_dec ≈ 0.025 ms</text>
    <text x="480" y="455" class="body-text">Hardware AES-NI acc.</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 650 280 L 680 280" class="arrow"/>

  <!-- Stage 4: Ed25519 Wallet Signature -->
  <g filter="url(#shadow)">
    <rect x="680" y="80" width="185" height="400" class="box-purple"/>
    <rect x="680" y="80" width="185" height="35" fill="#e9d5ff" rx="8" ry="8"/>
    <text x="772" y="103" class="header-text" text-anchor="middle" fill="#7e22ce">Stage 4: Ed25519 Signing</text>

    <text x="692" y="140" class="body-text" font-weight="bold">Asymmetric Digital Sign:</text>
    <rect x="688" y="150" width="168" height="60" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="695" y="172" font-family="Consolas" font-size="10" fill="#7e22ce">\sigma = Sign(sk, TxDigest)</text>
    <text x="695" y="195" font-family="Consolas" font-size="9" fill="#475569">64-byte Ed25519 signature</text>

    <text x="692" y="235" class="body-text" font-weight="bold">Public Key Verification:</text>
    <rect x="688" y="245" width="168" height="45" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="695" y="265" font-family="Consolas" font-size="10" fill="#7e22ce">Verify(pk, TxDigest, \sigma)</text>
    <text x="695" y="280" font-family="Consolas" font-size="9" fill="#15803d">Sui Wallet / JWT Auth</text>

    <text x="692" y="315" class="body-text" font-weight="bold">Cryptographic Spec:</text>
    <text x="692" y="335" class="body-text">• Curve25519 / SHA-512</text>
    <text x="692" y="355" class="body-text">• 128-bit security level</text>

    <rect x="688" y="380" width="168" height="85" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="695" y="400" class="body-text" font-weight="bold">Execution Latency:</text>
    <text x="695" y="420" font-family="Consolas" font-size="10" fill="#9333ea">T_sign ≈ 0.48 ms</text>
    <text x="695" y="440" font-family="Consolas" font-size="10" fill="#9333ea">T_verify ≈ 0.82 ms</text>
    <text x="695" y="455" class="body-text">Side-channel resistant</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 865 280 L 895 280" class="arrow"/>

  <!-- Stage 5: Sui Move Blockchain State -->
  <g filter="url(#shadow)">
    <rect x="895" y="80" width="175" height="400" class="box-indigo"/>
    <rect x="895" y="80" width="175" height="35" fill="#c7d2fe" rx="8" ry="8"/>
    <text x="982" y="103" class="header-text" text-anchor="middle" fill="#3730a3">Stage 5: Move On-Chain</text>

    <text x="905" y="140" class="body-text" font-weight="bold">ProduceBatch Object:</text>
    <rect x="902" y="150" width="160" height="110" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="908" y="170" font-family="Consolas" font-size="9" fill="#3730a3">struct ProduceBatch {</text>
    <text x="914" y="188" font-family="Consolas" font-size="9" fill="#334155">id: UID,</text>
    <text x="914" y="204" font-family="Consolas" font-size="9" fill="#334155">crop_type: String,</text>
    <text x="914" y="220" font-family="Consolas" font-size="9" fill="#334155">weight_kg: u64,</text>
    <text x="914" y="236" font-family="Consolas" font-size="9" fill="#0f766e">data_hash: vector&lt;u8&gt;</text>
    <text x="908" y="252" font-family="Consolas" font-size="9" fill="#3730a3">}</text>

    <text x="905" y="285" class="body-text" font-weight="bold">Consensus Properties:</text>
    <text x="905" y="305" class="body-text">• Parallel Execution</text>
    <text x="905" y="325" class="body-text">• Mysticeti / Narwhal</text>
    <text x="905" y="345" class="body-text">• Single-owner bypass</text>

    <rect x="902" y="365" width="160" height="100" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="908" y="385" class="body-text" font-weight="bold">On-Chain Latency:</text>
    <text x="908" y="405" font-family="Consolas" font-size="10" fill="#4f46e5">Mint: ~1.20 s</text>
    <text x="908" y="425" font-family="Consolas" font-size="10" fill="#4f46e5">Transfer: ~0.90 s</text>
    <text x="908" y="445" font-family="Consolas" font-size="10" fill="#4f46e5">Finality: &lt;3.00 s</text>
    <text x="908" y="458" class="body-text">Gas: ~0.003 SUI</text>
  </g>

  <!-- Summary Footer -->
  <g filter="url(#shadow)">
    <rect x="30" y="500" width="1040" height="115" fill="#ffffff" stroke="#e2e8f0" rx="8"/>
    <text x="50" y="530" class="header-text" fill="#0f172a">Summary of TerraNode Security Model (Research Objective 3):</text>
    <text x="50" y="555" class="body-text">1. <tspan font-weight="bold">Sub-Millisecond Edge Cryptography:</tspan> SHA-256 integrity digest (0.012 ms) and AES-256-GCM encryption (0.028 ms) provide zero computational bottleneck on IoT/farm clients.</text>
    <text x="50" y="578" class="body-text">2. <tspan font-weight="bold">Asymmetric Wallet Identity:</tspan> Ed25519 signatures (0.48 ms signing, 0.82 ms verify) establish decentralized identity verification without relying on central secrets.</text>
    <text x="50" y="601" class="body-text">3. <tspan font-weight="bold">On-Chain Immutability:</tspan> Sui Move objects cryptographically encapsulate the SHA-256 data hash, guaranteeing end-to-end provenance at negligible gas cost (0.003 SUI).</text>
  </g>
</svg>
