<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" width="100%" height="100%">
  <defs>
    <style>
      .hdr-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
      .step-hdr { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .step-desc { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #475569; }
      .step-code { font-family: 'Consolas', 'Courier New', monospace; font-size: 12.5px; font-weight: 600; fill: #0284c7; }
      .step-badge { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 800; fill: #ffffff; }
      .pill-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #ffffff; }
      .outcome-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #065f46; }
      .outcome-bullet { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #1e293b; }
      .fail-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 14.5px; font-weight: 700; fill: #991b1b; }
      .fail-desc { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #dc2626; }
    </style>
    <filter id="shadow" x="-4%" y="-2%" width="108%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#2563eb" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#9333ea" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#059669" />
    </marker>
  </defs>

  <!-- ==================== TOP DECISION CARD ==================== -->
  <g transform="translate(370, 10)">
    <rect width="360" height="46" rx="23" fill="#0f172a" filter="url(#shadow)" />
    <!-- Lock Icon -->
    <path d="M 45 23 L 45 18 C 45 13 55 13 55 18 L 55 23 M 40 23 L 60 23 L 60 33 L 40 33 Z" stroke="#38bdf8" stroke-width="2" fill="none" />
    <text x="190" y="29" text-anchor="middle" class="hdr-text">Client Selects Authentication Pathway</text>
  </g>

  <!-- Decision Branch Connectors -->
  <path d="M 460 56 L 460 85 L 260 85 L 260 105" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)" />
  <path d="M 640 56 L 640 85 L 840 85 L 840 105" fill="none" stroke="#9333ea" stroke-width="2.5" marker-end="url(#arr-purple)" />

  <!-- ==================== PATHWAY A: Credential-Based Auth (Left) ==================== -->
  <g transform="translate(10, 110)">
    <rect width="525" height="460" rx="10" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.8" filter="url(#shadow)" />
    <path d="M 0 10 Q 0 0 10 0 L 515 0 Q 525 0 525 10 L 525 40 L 0 40 Z" fill="#1e40af" />
    <text x="20" y="26" class="hdr-text">Pathway A: Credential-Based Auth</text>
    <rect x="375" y="10" width="135" height="22" rx="11" fill="#3b82f6" opacity="0.9" />
    <text x="442" y="25" text-anchor="middle" class="pill-text">SimpleJWT Engine</text>

    <!-- Step A1 -->
    <g transform="translate(15, 52)">
      <rect width="495" height="85" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <circle cx="28" cy="24" r="12" fill="#1e40af" />
      <text x="28" y="28" text-anchor="middle" class="step-badge">A1</text>
      <text x="50" y="28" class="step-hdr">Client Credentials Entry</text>
      <text x="50" y="52" class="step-desc">User enters Email and Password in React UI and submits</text>
      <text x="50" y="70" class="step-desc">over TLS 1.3 encrypted HTTPS connection to REST endpoint.</text>
    </g>

    <!-- Step A2 -->
    <g transform="translate(15, 150)">
      <rect width="495" height="85" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <circle cx="28" cy="24" r="12" fill="#1e40af" />
      <text x="28" y="28" text-anchor="middle" class="step-badge">A2</text>
      <text x="50" y="28" class="step-hdr">Django User Record Lookup</text>
      <text x="50" y="52" class="step-desc">Backend queries PostgreSQL database for matching <tspan font-weight="700" fill="#1e40af">CustomUser</tspan></text>
      <text x="50" y="70" class="step-desc">record by email address (case-insensitive lookup).</text>
    </g>

    <!-- Step A3 -->
    <g transform="translate(15, 248)">
      <rect width="495" height="85" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <circle cx="28" cy="24" r="12" fill="#1e40af" />
      <text x="28" y="28" text-anchor="middle" class="step-badge">A3</text>
      <text x="50" y="28" class="step-hdr">Argon2id Hash Verification</text>
      <text x="50" y="52" class="step-desc">Django auth hasher executes memory-hard Argon2id key</text>
      <text x="50" y="70" class="step-desc">derivation to verify user password against stored hash digest.</text>
    </g>

    <!-- Step A4 -->
    <g transform="translate(15, 346)">
      <rect width="495" height="95" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <circle cx="28" cy="24" r="12" fill="#1e40af" />
      <text x="28" y="28" text-anchor="middle" class="step-badge">A4</text>
      <text x="50" y="28" class="step-hdr">RoleGuard &amp; Account Validation</text>
      <text x="50" y="52" class="step-desc">Checks <tspan font-weight="700" fill="#0284c7">is_active</tspan> status, extracts user role</text>
      <text x="50" y="70" class="step-desc">(Farmer / Logistics / Admin), and prepares JWT claims payload.</text>
    </g>
  </g>

  <!-- ==================== PATHWAY B: Sui Blockchain Wallet Sign-In (Right) ==================== -->
  <g transform="translate(565, 110)">
    <rect width="525" height="460" rx="10" fill="#f8fafc" stroke="#e9d5ff" stroke-width="1.8" filter="url(#shadow)" />
    <path d="M 0 10 Q 0 0 10 0 L 515 0 Q 525 0 525 10 L 525 40 L 0 40 Z" fill="#581c87" />
    <text x="20" y="26" class="hdr-text">Pathway B: Sui Blockchain Wallet Sign-In</text>
    <rect x="375" y="10" width="135" height="22" rx="11" fill="#9333ea" opacity="0.9" />
    <text x="442" y="25" text-anchor="middle" class="pill-text">Ed25519 Signer</text>

    <!-- Step B1 -->
    <g transform="translate(15, 52)">
      <rect width="495" height="85" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <circle cx="28" cy="24" r="12" fill="#581c87" />
      <text x="28" y="28" text-anchor="middle" class="step-badge">B1</text>
      <text x="50" y="28" class="step-hdr">Intent Message Construction</text>
      <text x="50" y="52" class="step-desc">Frontend formats cryptographic challenge message:</text>
      <text x="50" y="70" class="step-code">"Login to TerraNode with {sui_public_key}"</text>
    </g>

    <!-- Step B2 -->
    <g transform="translate(15, 150)">
      <rect width="495" height="85" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <circle cx="28" cy="24" r="12" fill="#581c87" />
      <text x="28" y="28" text-anchor="middle" class="step-badge">B2</text>
      <text x="50" y="28" class="step-hdr">Sui Wallet Ed25519 Signing</text>
      <text x="50" y="52" class="step-desc">User approves sign-in in browser extension modal;</text>
      <text x="50" y="70" class="step-desc">extension returns 64-byte Ed25519 signature buffer.</text>
    </g>

    <!-- Step B3 -->
    <g transform="translate(15, 248)">
      <rect width="495" height="85" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <circle cx="28" cy="24" r="12" fill="#581c87" />
      <text x="28" y="28" text-anchor="middle" class="step-badge">B3</text>
      <text x="50" y="28" class="step-hdr">Intent Prefix &amp; BLAKE2b Hash</text>
      <text x="50" y="52" class="step-desc">Backend prepends intent bytes <tspan font-weight="700" fill="#0284c7">[3, 0, 0]</tspan> + ULEB128 length,</text>
      <text x="50" y="70" class="step-desc">then computes 32-byte BLAKE2b personal message digest.</text>
    </g>

    <!-- Step B4 -->
    <g transform="translate(15, 346)">
      <rect width="495" height="95" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <circle cx="28" cy="24" r="12" fill="#581c87" />
      <text x="28" y="28" text-anchor="middle" class="step-badge">B4</text>
      <text x="50" y="28" class="step-hdr">PyNaCl Cryptographic Verification</text>
      <text x="50" y="52" class="step-desc">Backend verifies Ed25519 signature against registered</text>
      <text x="50" y="70" class="step-desc"><tspan font-weight="700" fill="#0284c7">sui_public_key</tspan> using PyNaCl VerifyKey cryptography.</text>
    </g>
  </g>

  <!-- Pathway Convergence Lines -->
  <path d="M 270 570 L 270 600 L 480 600" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-green)" />
  <path d="M 830 570 L 830 600 L 620 600" fill="none" stroke="#9333ea" stroke-width="2.5" marker-end="url(#arr-green)" />

  <!-- ==================== BOTTOM OUTCOME CARDS ==================== -->
  <!-- Success Card -->
  <g transform="translate(50, 615)">
    <rect width="750" height="115" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2" filter="url(#shadow)" />
    <!-- Checkmark Icon -->
    <circle cx="45" cy="57" r="22" fill="#10b981" />
    <path d="M 37 57 L 43 63 L 53 51" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <text x="80" y="32" class="outcome-title">Authentication Successful: Tokens Issued &amp; Session Active</text>
    <text x="80" y="56" class="outcome-bullet">• <tspan font-weight="700">Access Token:</tspan> SimpleJWT Bearer Token (15-Min Lifetime) for API authorization</text>
    <text x="80" y="78" class="outcome-bullet">• <tspan font-weight="700">Refresh Token:</tspan> Secure HTTP-Only Cookie (7-Day Lifetime) with automatic rotation</text>
    <text x="80" y="100" class="outcome-bullet">• <tspan font-weight="700">Role Routing:</tspan> Client navigates to role-specific dashboard (Farmer / Logistics / Admin)</text>
  </g>

  <!-- Failure Card -->
  <g transform="translate(820, 615)">
    <rect width="270" height="115" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.8" filter="url(#shadow)" />
    <!-- X Icon -->
    <circle cx="36" cy="57" r="16" fill="#ef4444" />
    <path d="M 30 51 L 42 63 M 42 51 L 30 63" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    <text x="62" y="44" class="fail-title">Verification Failure</text>
    <text x="62" y="68" class="fail-desc">HTTP 401 Unauthorized</text>
    <text x="62" y="88" class="fail-desc">Logged in Audit Security Trail</text>
  </g>
</svg>
