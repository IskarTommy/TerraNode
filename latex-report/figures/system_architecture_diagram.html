<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    width: 2400px;
    height: 1800px;
    background-color: #f8fafc;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  svg {
    width: 2400px;
    height: 1800px;
  }
</style>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="2400" height="1800" style="background:#f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a" letter-spacing="0.5">TERRANODE SYSTEM ARCHITECTURE</text>
  <text x="600" y="60" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">Three-Tier Blockchain-Anchored Smart Farm Security &amp; Analytics Framework</text>

  <!-- ==================== TIER 1: PRESENTATION LAYER ==================== -->
  <rect x="50" y="80" width="1100" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="50" y="80" width="1100" height="32" rx="12" fill="#f1f5f9" />
  <rect x="50" y="100" width="1100" height="12" fill="#f1f5f9" />
  <text x="75" y="102" font-size="13" font-weight="700" fill="#334155" letter-spacing="0.8">1. PRESENTATION LAYER (FRONTEND)</text>

  <!-- Client App Box -->
  <g transform="translate(360, 125)">
    <rect x="0" y="0" width="480" height="85" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#boxShadow)" />
    <text x="240" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">React 19 + TypeScript Web Application</text>
    <text x="240" y="54" text-anchor="middle" font-size="13" font-weight="500" fill="#15803d">Vite SPA • RoleGuard Routing • Recharts Data Visualization</text>
    <text x="240" y="72" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">AuthContext (JWT &amp; Wallet Login) • WalletContext (Mysten dApp Kit)</text>
  </g>

  <!-- ==================== TIER 2: BUSINESS LOGIC LAYER ==================== -->
  <rect x="50" y="270" width="1100" height="350" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="50" y="270" width="1100" height="32" rx="12" fill="#f1f5f9" />
  <rect x="50" y="290" width="1100" height="12" fill="#f1f5f9" />
  <text x="75" y="292" font-size="13" font-weight="700" fill="#334155" letter-spacing="0.8">2. BUSINESS LOGIC LAYER (BACKEND)</text>

  <!-- DRF Core Gateway -->
  <g transform="translate(360, 315)">
    <rect x="0" y="0" width="480" height="65" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#boxShadow)" />
    <text x="240" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">Django REST Framework Backend (Django 5.1)</text>
    <text x="240" y="48" text-anchor="middle" font-size="12.5" font-weight="500" fill="#2563eb">API Gateway • Token Verification • Throttling • Serializers</text>
  </g>

  <!-- Users App -->
  <g transform="translate(80, 420)">
    <rect x="0" y="0" width="235" height="175" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#boxShadow)" />
    <rect x="0" y="0" width="235" height="32" rx="8" fill="#f8fafc" />
    <text x="117" y="22" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Users App</text>
    <text x="117" y="55" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Auth &amp; Access Control</text>
    <text x="20" y="82" font-size="11.5" fill="#334155">• JWT Token Lifecycle</text>
    <text x="20" y="104" font-size="11.5" fill="#334155">• Argon2id Password Hash</text>
    <text x="20" y="126" font-size="11.5" fill="#334155">• Sui Ed25519 Verify</text>
    <text x="20" y="148" font-size="11.5" fill="#334155">• Custom RBAC Permissions</text>
  </g>

  <!-- Telemetry App -->
  <g transform="translate(345, 420)">
    <rect x="0" y="0" width="235" height="175" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#boxShadow)" />
    <rect x="0" y="0" width="235" height="32" rx="8" fill="#f8fafc" />
    <text x="117" y="22" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Telemetry App</text>
    <text x="117" y="55" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Sensor Data Processing</text>
    <text x="20" y="82" font-size="11.5" fill="#334155">• Temp, Moisture, Soil pH</text>
    <text x="20" y="104" font-size="11.5" fill="#334155">• Range Validation</text>
    <text x="20" y="126" font-size="11.5" fill="#334155">• SHA-256 Digest Generator</text>
    <text x="20" y="148" font-size="11.5" fill="#334155">• Duplicate Filter &amp; Storage</text>
  </g>

  <!-- Ledger App -->
  <g transform="translate(615, 420)">
    <rect x="0" y="0" width="235" height="175" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#boxShadow)" />
    <rect x="0" y="0" width="235" height="32" rx="8" fill="#f8fafc" />
    <text x="117" y="22" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Ledger App</text>
    <text x="117" y="55" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Batch &amp; Custody Manager</text>
    <text x="20" y="82" font-size="11.5" fill="#334155">• 2-Step Batch Workflow</text>
    <text x="20" y="104" font-size="11.5" fill="#334155">• Status: PENDING → MINTED</text>
    <text x="20" y="126" font-size="11.5" fill="#334155">• Sui Object ID Binding</text>
    <text x="20" y="148" font-size="11.5" fill="#334155">• Custody Transfer Logging</text>
  </g>

  <!-- Analytics App -->
  <g transform="translate(885, 420)">
    <rect x="0" y="0" width="235" height="175" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#boxShadow)" />
    <rect x="0" y="0" width="235" height="32" rx="8" fill="#f8fafc" />
    <text x="117" y="22" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Analytics App</text>
    <text x="117" y="55" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Yield Prediction Engine</text>
    <text x="20" y="82" font-size="11.5" fill="#334155">• Weighted Moving Average</text>
    <text x="20" y="104" font-size="11.5" fill="#334155">• Confidence Score C(n)</text>
    <text x="20" y="126" font-size="11.5" fill="#334155">• Temp Deviation Penalty</text>
    <text x="20" y="148" font-size="11.5" fill="#334155">• Actionable Insights</text>
  </g>

  <!-- Connectors -->
  <path d="M 440 380 L 440 400 L 197 400 L 197 420" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 520 380 L 520 400 L 462 400 L 462 420" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 680 380 L 680 400 L 732 400 L 732 420" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 760 380 L 760 400 L 1002 400 L 1002 420" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- ==================== TIER 3: DATA PERSISTENCE LAYER ==================== -->
  <rect x="50" y="660" width="1100" height="200" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="50" y="660" width="1100" height="32" rx="12" fill="#f1f5f9" />
  <rect x="50" y="680" width="1100" height="12" fill="#f1f5f9" />
  <text x="75" y="682" font-size="13" font-weight="700" fill="#334155" letter-spacing="0.8">3. DATA PERSISTENCE &amp; BLOCKCHAIN LEDGER LAYER</text>

  <!-- PostgreSQL -->
  <g transform="translate(100, 710)">
    <rect x="0" y="0" width="290" height="125" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5" filter="url(#boxShadow)" />
    <text x="145" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#6b21a8">PostgreSQL Database</text>
    <text x="145" y="48" text-anchor="middle" font-size="12" font-weight="600" fill="#7e22ce">Primary Relational Storage</text>
    <text x="20" y="75" font-size="11.5" fill="#3b0764">• User Accounts &amp; Profiles</text>
    <text x="20" y="95" font-size="11.5" fill="#3b0764">• Environmental Telemetry &amp; SHA-256</text>
    <text x="20" y="115" font-size="11.5" fill="#3b0764">• Produce Batches &amp; Audit Logs</text>
  </g>

  <!-- Redis -->
  <g transform="translate(465, 710)">
    <rect x="0" y="0" width="270" height="125" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" filter="url(#boxShadow)" />
    <text x="135" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#9f1239">Redis In-Memory Cache</text>
    <text x="135" y="48" text-anchor="middle" font-size="12" font-weight="600" fill="#be123c">High-Speed Key-Value Store</text>
    <text x="20" y="75" font-size="11.5" fill="#4c0519">• Cached Yield Forecasts</text>
    <text x="20" y="95" font-size="11.5" fill="#4c0519">• 600s (10 min) TTL Expiration</text>
    <text x="20" y="115" font-size="11.5" fill="#4c0519">• Sub-15ms Latency Response</text>
  </g>

  <!-- Sui Blockchain -->
  <g transform="translate(805, 710)">
    <rect x="0" y="0" width="310" height="125" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5" filter="url(#boxShadow)" />
    <text x="155" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">Sui Blockchain (Testnet)</text>
    <text x="155" y="48" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">Immutable Distributed Ledger</text>
    <text x="20" y="75" font-size="11.5" fill="#134e4a">• Move Smart Contracts (Objects)</text>
    <text x="20" y="95" font-size="11.5" fill="#134e4a">• On-Chain SHA-256 Hash Anchoring</text>
    <text x="20" y="115" font-size="11.5" fill="#134e4a">• Verifiable Custody Event Emissions</text>
  </g>

  <!-- Inter-tier links -->
  <path d="M 540 210 L 540 315" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="425" y="235" width="230" height="24" rx="4" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1" />
  <text x="540" y="251" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">HTTPS / JSON REST API (JWT Auth)</text>

  <path d="M 840 167 L 1080 167 L 1080 710" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)" />
  <rect x="975" y="235" width="170" height="24" rx="4" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1" />
  <text x="1060" y="251" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">dApp Kit / Sui RPC (Signing)</text>

  <path d="M 197 595 L 197 710" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 462 595 L 462 640 L 295 640 L 295 710" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 732 595 L 732 640 L 350 640 L 350 710" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

  <path d="M 760 595 L 760 640 L 890 640 L 890 710" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />
  <rect x="785" y="628" width="130" height="20" rx="3" fill="#ccfbf1" stroke="#5eead4" stroke-width="1" />
  <text x="850" y="642" text-anchor="middle" font-size="10" font-weight="600" fill="#0f766e">Verify Object IDs / Digest</text>

  <path d="M 920 595 L 920 645 L 380 645 L 380 710" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)" />
  <path d="M 1002 595 L 1002 650 L 600 650 L 600 710" fill="none" stroke="#be123c" stroke-width="1.5" marker-end="url(#arrow)" />
</svg>

</body>
</html>
